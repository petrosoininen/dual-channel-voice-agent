name: Credential-free validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate Python, contracts, skills, and repository
        run: |
          python -m pytest -q tests/backend tests/contract tests/repository
          python -m scripts.generate_contract_schemas --check
          python -m scripts.verify_contract_freeze
          python -m scripts.validate_iac_parity
          python -m scripts.validate_release
          for skill in .agents/skills/*; do agentskills validate "$skill"; done

      - name: Validate frontend
        run: |
          npm run test:frontend
          npm run typecheck
          npm run build
          npm run test:e2e -- --project=chromium

      - name: Validate Bicep
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep lint --file infra/bicep/main.bicep

      - name: Validate Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

      - name: Scan authored tree
        shell: pwsh
        run: ./scripts/verify_clean_room.ps1

      - name: Scan secrets independently
        run: >-
          detect-secrets scan --all-files
          --exclude-files
          '(^|/)(node_modules|dist|test-results|playwright-report|\.terraform|__pycache__|\.pytest_cache|coverage)(/|$)|(^|/)(package-lock\.json|contracts/contract-freeze\.json|infra/terraform/\.terraform\.lock\.hcl)$'

      - name: Audit dependencies
        run: |
          python -m pip_audit -r requirements.txt
          npm audit --package-lock-only
