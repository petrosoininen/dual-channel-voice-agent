name: Bug report
description: Report reproducible repository behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include real environment values, provider identifiers, transcripts, or secrets.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, using sanitized details?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include provider selections and evidence class, not environment values.
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed credentials, IDs, endpoints, resource names, transcripts, and private data.
          required: true
